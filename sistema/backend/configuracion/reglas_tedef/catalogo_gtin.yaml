# Catalogo GTIN (EAN) DS. 024-2005-SA, transcrito literalmente (Regla 1;
# Seccion 3.3 y Seccion 4 del plan v3): el Anexo 1 define el dominio del
# campo 8 de T4 ("Catalogo") y la regla por tipo de producto, pero no
# publica la lista de codigos del campo 9 -- estos 19 productos si.
#
# tipo_producto_tedef (T4 campo 7): M = medicamento o producto de origen
# biologico; I = insumo, material, dispositivo medico o protesis; B =
# productos sanitarios o cosmeticos; A = suplemento alimenticio.
# DISPOSITIVO MEDICO -> I, COSMETICO -> B, ALIMENTO -> A siempre;
# PRODUCTO FARMACEUTICO -> M solo cuando la denominacion comun nombra un
# principio activo especifico (nunca cuando es un rotulo generico de
# "suplemento dietetico/nutricional" o "vitaminas y minerales": ese caso
# corresponde al tipo P del Anexo 1, fuera de este catalogo).
#
# codigo va entre comillas siempre: varios GTIN empiezan con cero, y un
# valor sin comillas se leeria como entero, perdiendo esos ceros.
#
# Sin marcas de origen ni de vigencia (Regla 16): la trazabilidad de cada
# producto a su captura y fila se registra en docs/DECISIONES.md al
# cerrar la Fase 17, no en este archivo.

