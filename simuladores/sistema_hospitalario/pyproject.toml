[project]
name = "simulador-sistema-hospitalario"
version = "0.1.0"
description = "Simulador del sistema hospitalario de la clinica (atenciones ya cerradas que el sistema de cuentas medicas importa). Datos ficticios."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = [
    "N999", # nombres de modulo en espanol
]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["pruebas"]
python_files = ["prueba_*.py"]
python_functions = ["prueba_*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
