# Parametros del motor de sugerencia CPMS (Seccion 8.2).
#
# Ninguna fuente de la Seccion 2 fija estos valores -- el propio punto 5
# dice "puntaje final como combinacion ponderada, CON PESOS EN
# CONFIGURACION", es decir que el plan espera que esto se decida aqui, no
# que se derive de un anexo. Supuesto de esta fase (docs/DECISIONES.md):
# se prioriza la similitud lexica (TF-IDF) sobre la de conjunto de tokens,
# que solo reordena para favorecer coincidencias de palabras completas
# entre candidatos ya lexicamente parecidos.

peso_similitud_lexica: 0.7
peso_similitud_tokens: 0.3

candidatos_recuperados: 50
candidatos_devueltos: 10

# Seccion 8.2, punto 4: "n-gramas de caracteres de 3 a 5" y "unigramas y
# bigramas de palabra".
ngramas_caracteres_minimo: 3
ngramas_caracteres_maximo: 5
ngramas_palabras_minimo: 1
ngramas_palabras_maximo: 2
