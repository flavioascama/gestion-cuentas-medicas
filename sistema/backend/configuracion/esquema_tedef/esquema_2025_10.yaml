  - numero: 12
    nombre: Mecanismo de Pago
    obligatorio: true
    longitud: 2
    decimales: null
    posicion_inicial: 78
    descripcion: '01 = Pago por servicio (Pago según lo gastado en la atención y bajo la condición de
      que se trate de gastos cubiertos en el plan de salud del paciente)

      02 = Pacientes mes (Asignación de un monto mensual convenido entre la IAFAS e IPRESS para la atención
      ambulatoria del paciente en el mes, activado si se da la demanda de servicios)

      03 = Paquete quirúrgico (Asignación de un monto fijo convenido entre IAFAS e IPRESS por tipo de
      intervención quirúrgica y que cubre los gastos convenidos)

      04 = Capitación (Pago en el cual los proveedores reciben una cantidad fija acordada de antemano
      por cada asegurado que se inscriba con ellos. El financiamiento no depende de la utilización que
      haga el asegurado de los servicios de salud)

      06 = Pago fijo por atención (Pago en el cual los proveedores reciben una cantidad fija acordada
      de antemano por cada prestación realizada)

      99 = Otros mecanismos de pago'
    criterios_texto: C1. Solo debe contener uno de los valores definidos
  - numero: 13
    nombre: Sub Tipo de Mecanismo de Pago
    obligatorio: true
    longitud: 3
    decimales: null
    posicion_inicial: 80
    descripcion: Corresponde a los subtipos de mecanismo de pago empleado por la IAFAS
    criterios_texto: C1. Solo debe contener uno de los valores definidos en la el catálogo de Sub Tipo
      de Mecanismo Pago, caso contrario si la IPRESS o IAFAS no cuenta con el valor se consignará '999'.
  - numero: 14
