# Diccionario de mapeo TEDEF (Seccion 7.2 del plan).
#
# Entregable obligatorio y explicito: no existe en la tesis ni en los
# anexos. Una entrada por cada uno de los 104 campos de T1, T2 y T3 (las
# unicas tablas que este prototipo genera, Seccion 1.2). El generador de
# lotes (Fase 7) falla al arrancar si falta una entrada para algun campo
# de estas tres tablas.
#
# origen: columna (viene del modelo relacional) | constante (config. de la
# IPRESS o valor fijo del dominio del anexo) | calculado (formula citada
# de un criterio del Anexo 1) | blanco (no aplica al alcance del
# prototipo, con justificacion).
#
# PENDIENTE DE REVISION: la Seccion 7.2 exige que este diccionario "se
# revise con el asesor antes de la fase 6". Esa revision humana no se ha
# hecho todavia. Doce entradas llevan una nota que menciona "asesor",
# "pendiente", "bloqueado" o "provisional" porque el Anexo 1 no da una
# formula explicita, o el modelo de datos necesario (profesional
# responsable, subtipo de cobertura, codigo rubro) no esta definido en
# ninguna fuente de la Seccion 2, o el valor usado (T2 campo 18, CIE-10)
# no viene del catalogo oficial. Buscar esas notas antes de dar por
# cerrado el prototipo. Ver tambien docs/DECISIONES.md y
# docs/PENDIENTES.md.
- tabla: T1
  campo: 1
  nombre: Fecha de envío
  origen: columna
  expresion: lote.generado_en
  transformacion: fecha(AAAAMMDD)
  nota: Parte de fecha del instante en que se genera el lote (GenerarLote, Sección 7.6), no de la remisión
    posterior (7.8).
- tabla: T1
  campo: 2
  nombre: Hora de Envío
  origen: columna
  expresion: lote.generado_en
  transformacion: hora(HHMMSS)
  nota: Parte de hora del mismo instante que el campo 1.
- tabla: T1
  campo: 3
  nombre: Número de Lote
  origen: columna
  expresion: lote.numero
  transformacion: rellenar_ceros_izquierda(7)
  nota: Asignado de forma transaccional y único por IAFAS (Sección 7.6, punto 2).
- tabla: T1
  campo: 4
  nombre: Código del Fondo de Aseguramiento en Salud (IAFAS)
  origen: columna
  expresion: lote.iafas.codigo
  transformacion: rellenar_ceros_izquierda(5)
  nota: Ejemplo literal de la Sección 7.2 del plan.
- tabla: T1
  campo: 5
  nombre: Ruc del prestador o IPRESS
  origen: constante
  expresion: configuracion_ipress.ruc
  transformacion: ninguna(11)
  nota: RUC propio de la clínica que opera el sistema (Sección 6.1, tabla ipress).
- tabla: T1
  campo: 6
  nombre: Código IPRESS
  origen: constante
  expresion: configuracion_ipress.codigo_ipress
  transformacion: ninguna(8)
  nota: Código IPRESS propio de la clínica.
- tabla: T1
  campo: 7
  nombre: Tipo Documento de Pago
  origen: columna
  expresion: documento.tipo_documento_pago
  transformacion: rellenar_ceros_izquierda(2)
  nota: ''
- tabla: T1
  campo: 8
  nombre: Número de Documento de Pago
  origen: columna
  expresion: documento.serie + documento.numero
  transformacion: formato_serie_numero()
  nota: Formato serie+número según los criterios C1 y C2 del propio campo (serie alfanumérica si el comprobante
    es electrónico; cuarto carácter '0' si no).
- tabla: T1
  campo: 9
  nombre: Fecha de Emisión
  origen: columna
  expresion: documento.fecha_emision
  transformacion: fecha(AAAAMMDD)
  nota: ''
- tabla: T1
  campo: 10
  nombre: Producto
  origen: constante
  expresion: '''99999'''
  transformacion: ninguna(5)
  nota: El prototipo no gestiona el catálogo de productos por IAFAS; se usa el valor de relleno que el
    propio criterio C1 define para ese caso.
- tabla: T1
  campo: 11
  nombre: Cantidad de prestaciones de salud del documento facturador
  origen: calculado
  expresion: contar(prestaciones_T2_del_documento)
  transformacion: rellenar_ceros_izquierda(5)
  nota: Conteo de filas T2 asociadas al mismo documento facturador (Sección 7.5); no es una suma monetaria,
    sino la definición literal del propio campo.
- tabla: T1
  campo: 12
  nombre: Mecanismo de Pago
  origen: constante
  expresion: '''01'''
  transformacion: ninguna(2)
  nota: El prototipo solo modela facturación por servicio prestado (pago por servicio); no se modelan
    mecanismos capitados ni paquetes (fuera del alcance de la Sección 1.2). Declarar como limitación en
    el Anexo A de la tesis.
- tabla: T1
  campo: 13
  nombre: Sub Tipo de Mecanismo de Pago
  origen: constante
  expresion: '''999'''
  transformacion: ninguna(3)
  nota: El catálogo de subtipos no está entre las fuentes de la Sección 2; se usa el valor de relleno
    que el propio criterio C1 define para ese caso.
- tabla: T1
  campo: 14
  nombre: Monto Pre Pactado
  origen: constante
  expresion: Decimal('0.00')
  transformacion: monto(12,2)
  nota: 'Mecanismo de pago fijo en ''01''; no aplica monto pre pactado (criterio C1: ''De no corresponder
    se consignará 0.00'').'
- tabla: T1
  campo: 15
  nombre: Fecha de inicio del Periodo Pre Pactado
  origen: blanco
  expresion: ''
  transformacion: ''
  nota: 'Mecanismo de pago fijo en ''01'' (criterio C2: en blanco si el mecanismo es distinto de 02, 04
    o 06).'
- tabla: T1
  campo: 16
  nombre: Tipo de moneda
  origen: constante
  expresion: '''1'''
  transformacion: ninguna(1)
  nota: 'Supuesto documentado: el prototipo opera únicamente en soles.'
- tabla: T1
  campo: 17
  nombre: Monto exonerado de IGV
  origen: calculado
  expresion: sumar(prestaciones_T2.gasto_exonerado_igv)
  transformacion: monto(12,2)
  nota: 'Criterio C2: sumatoria del campo ''Gasto en productos, servicios o medicamentos exonerados de
    IGV'' (T2 campo 42) de todas las prestaciones del documento.'
- tabla: T1
  campo: 18
  nombre: Total Copago Fijo Afecto a IGV sin IGV
  origen: calculado
  expresion: sumar(prestaciones_T2.copago_fijo_afecto_igv)
  transformacion: monto(12,2)
  nota: 'Criterio C2: sumatoria del campo ''Copago Fijo afecto a IGV sin IGV'' (T2 campo 44).'
- tabla: T1
  campo: 19
  nombre: Total Copago Fijo Exonerado de IGV
  origen: calculado
  expresion: sumar(prestaciones_T2.copago_fijo_exonerado_igv)
  transformacion: monto(12,2)
  nota: 'Criterio C2: sumatoria del campo ''Copago Fijo exonerado de IGV'' (T2 campo 45).'
- tabla: T1
  campo: 20
  nombre: Total Copago Variable afecto a IGV sin IGV
  origen: calculado
  expresion: sumar(prestaciones_T2.copago_variable_afecto_igv)
  transformacion: monto(12,2)
  nota: 'Criterio C2: sumatoria del campo ''Copago Variable afecto a IGV sin IGV'' (T2 campo 46).'
- tabla: T1
  campo: 21
  nombre: Total Copago Variable Exonerado de IGV
  origen: calculado
  expresion: sumar(prestaciones_T2.copago_variable_exonerado_igv)
  transformacion: monto(12,2)
  nota: 'Criterio C2: sumatoria del campo ''Copago Variable exonerado de IGV'' (T2 campo 47).'
- tabla: T1
  campo: 22
  nombre: Base imponible
  origen: calculado
  expresion: formula_base_imponible(lote, mecanismo_pago)
  transformacion: monto(12,2)
  nota: 'Fórmula tomada del criterio C5 del campo 22 del Anexo 1 (rama ''01-Pago por Servicios'', la única
    que aplica dado el campo 12 constante). Criterio C6: ''0.00'' si el tipo de documento de pago es 10
    u 11.'
- tabla: T1
  campo: 23
  nombre: IGV del Monto Facturado
  origen: calculado
  expresion: base_imponible * configuracion_ipress.tasa_igv
  transformacion: monto(12,2)
  nota: 'El criterio del anexo (C1-C4) solo exige ''0.00'' si la IPRESS está exonerada; no da una fórmula
    de multiplicación. Se aplica la tasa de IGV vigente en el Perú (18 %, Ley del IGV) como parámetro
    de configuración de la IPRESS: es un dato tributario público, no una fórmula TEDEF, y se documenta
    como supuesto distinto de los demás ''calculado'' de este diccionario. Ver docs/DECISIONES.md.'
- tabla: T1
  campo: 24
  nombre: Monto Total Facturado
  origen: calculado
  expresion: formula_monto_total_facturado(lote, mecanismo_pago)
  transformacion: monto(12,2)
  nota: 'Fórmula tomada del criterio C5 del campo 24 del Anexo 1 (rama ''01-Pago por Servicios''). Criterio
    C6: ''0.00'' si el tipo de documento de pago es 10 u 11.'
- tabla: T1
  campo: 25
  nombre: Tipo de identificación de la Nota
  origen: columna
  expresion: nota_documento.tipo si el comprobante tiene nota, si no 'N'
  transformacion: ninguna(1)
  nota: RI-11 (2026-11-13). Una nota por comprobante, porque la Tabla 1 tiene un solo espacio de nota
    por documento. Sin nota, 'N' (Ningún documento de referencia).
- tabla: T1
  campo: 26
  nombre: Número de la Nota
  origen: columna
  expresion: nota_documento.serie + nota_documento.numero
  transformacion: ninguna(12)
  nota: Serie de cuatro caracteres y número de ocho dígitos (formato XXXX99999999). En blanco sin nota
    (criterio C2 del campo 25).
- tabla: T1
  campo: 27
  nombre: Monto de la Nota
  origen: columna
  expresion: nota_documento.monto
  transformacion: monto(12,2)
  nota: Sin IGV. En blanco sin nota (criterio C2 del propio campo).
- tabla: T1
  campo: 28
  nombre: Fecha de la Nota
  origen: columna
  expresion: nota_documento.fecha
  transformacion: fecha(AAAAMMDD)
  nota: No posterior al registro (criterio C1). En blanco sin nota (criterio C2).
- tabla: T1
  campo: 29
  nombre: Motivo de la Nota
  origen: columna
  expresion: nota_documento.motivo
  transformacion: ninguna(1)
  nota: R reingreso, A anulación, D descuento parcial. En blanco sin nota (criterio C2).
- tabla: T1
  campo: 30
  nombre: Fecha del primer envio del documento facturador
  origen: columna
  expresion: documento.fecha_primer_envio
  transformacion: fecha_o_blanco(AAAAMMDD)
  nota: 'Sección 6.2: protegida por disparador que impide su sobrescritura; RF-06.'
- tabla: T1
  campo: 31
  nombre: Indicador de Factura Global
  origen: constante
  expresion: '''N'''
  transformacion: ninguna(1)
  nota: El prototipo factura documento por documento, nunca de forma global.
- tabla: T2
  campo: 1
  nombre: RUC del prestador o IPRESS
  origen: constante
  expresion: configuracion_ipress.ruc
  transformacion: ninguna(11)
  nota: ''
- tabla: T2
  campo: 2
  nombre: Código IPRESS
  origen: constante
  expresion: configuracion_ipress.codigo_ipress
  transformacion: ninguna(8)
  nota: ''
- tabla: T2
  campo: 3
  nombre: Tipo Documento de Pago
  origen: columna
  expresion: documento.tipo_documento_pago
  transformacion: rellenar_ceros_izquierda(2)
  nota: ''
- tabla: T2
  campo: 4
  nombre: Número de Documento de Pago
  origen: columna
  expresion: documento.serie + documento.numero
  transformacion: formato_serie_numero()
  nota: ''
- tabla: T2
  campo: 5
  nombre: Correlativo de la prestación
  origen: calculado
  expresion: asignar_correlativo_ascendente(prestaciones_del_documento)
  transformacion: rellenar_ceros_izquierda(5)
  nota: 'Criterios C2 y C3: debe coincidir con la cantidad declarada en T1 campo 11 y quedar ordenado
    de forma ascendente.'
- tabla: T2
  campo: 6
  nombre: Código de prestación Interno de la IPRESS
  origen: columna
  expresion: cuenta.identificacion_interna
  transformacion: ninguna(10)
  nota: 'Sección 6.1, tabla cuenta_medica: ''Identificación interna''.'
- tabla: T2
  campo: 7
  nombre: Tipo de Afiliación del Paciente
  origen: columna
  expresion: acreditacion.tipo_afiliacion
  transformacion: valor_en_dominio()
  nota: La Sección 6.1 no enumera este atributo explícitamente dentro de 'acreditacion'; se agrega en
    la Fase 7 al construir el modelo real, junto con la respuesta del simulador ACREDITA SALUD. Marcar
    para revisión del asesor.
- tabla: T2
  campo: 8
  nombre: Código de Asegurado del Paciente
  origen: columna
  expresion: acreditacion.codigo_asegurado
  transformacion: alinear_derecha(20)
  nota: Código único que devuelve la consulta de cobertura (Sección 8.1). Mismo comentario que el campo
    7 sobre el modelo de 'acreditacion' en la Fase 7.
- tabla: T2
  campo: 9
  nombre: Tipo de documento de identidad
  origen: columna
  expresion: cuenta.asegurado.tipo_documento
  transformacion: ninguna(1)
  nota: Dominio del Anexo 1 (T2 campo 9), ya usado en Fase 4 para los datos sintéticos.
- tabla: T2
  campo: 10
  nombre: Número del documento de identidad
  origen: columna
  expresion: cuenta.asegurado.numero_documento
  transformacion: alinear_derecha(15)
  nota: ''
- tabla: T2
  campo: 11
  nombre: Número de Historia Clínica
  origen: columna
  expresion: cuenta.numero_historia_clinica
  transformacion: ninguna(8)
  nota: Atributo no enumerado explícitamente en la Sección 6.1; se agrega a cuenta_medica en la Fase 7
    porque la historia clínica es propia de cada atención.
- tabla: T2
  campo: 12
  nombre: Documento de autorización de la prestación
  origen: columna
  expresion: acreditacion.tipo_documento_autorizacion
  transformacion: rellenar_ceros_izquierda(2)
  nota: Clasificación del documento cuyo código está en 'acreditacion.codigo_autorizacion' (Sección 6.1).
    El código que entrega ACREDITA SALUD es la Solicitud de Atención Médica, '01' del catálogo.
- tabla: T2
  campo: 13
  nombre: Número del documento de autorización
  origen: columna
  expresion: acreditacion.codigo_autorizacion
  transformacion: alinear_derecha(20)
  nota: 'Sección 6.1, tabla acreditacion: ''código de autorización''.'
- tabla: T2
  campo: 14
  nombre: Segundo Documento de autorización de la prestación
  origen: calculado
  expresion: "'03' si la cuenta tiene carta de garantía registrada; '99' si no"
  transformacion: rellenar_ceros_izquierda(2)
  nota: La carta de garantía registrada (tabla carta_garantia) es el segundo documento de
    autorización; sin carta, '99' (No aplica).
- tabla: T2
  campo: 15
  nombre: Número del segundo documento de autorización
  origen: calculado
  expresion: carta_garantia.numero si la cuenta tiene carta; en blanco si no
  transformacion: alinear_derecha(20)
  nota: Con el campo 14 en '99' va en blanco (criterio C1 del propio campo); un número de carta
    mayor a 20 caracteres se recorta a 20.
- tabla: T2
  campo: 16
  nombre: Tipo de Cobertura o Tipo de Prestación
  origen: calculado
  expresion: '''4'' si cuenta.tipo_atencion=AMBULATORIA; ''6'' si EMERGENCIA; ''5'' si HOSPITALIZACION'
  transformacion: ninguna(1)
  nota: 'Atención importada del sistema hospitalario (2026-11-19): códigos del dominio del propio campo
    (4 = Ambulatorio, 5 = Hospitalaria, 6 = Emergencia). La cuenta manual sigue siendo ambulatoria (''4'',
    como viajaba antes).'
- tabla: T2
  campo: 17
  nombre: Subtipo de Cobertura
  origen: constante
  expresion: '''0000'''
  transformacion: ninguna(4)
  nota: El catálogo de SUSALUD para este campo no está entre las fuentes de la Sección 2 (no hay archivo
    en docs/fuentes/ que lo enumere). Valor de relleno documentado como no verificado; ver docs/PENDIENTES.md.
- tabla: T2
  campo: 18
  nombre: Primer Diagnóstico (CIE10)
  origen: columna
  expresion: cuenta.diagnostico_principal_cie10
  transformacion: ninguna(5)
  nota: 'Desde la Fase 17, se puebla con un código real del catálogo oficial CIE-10 del MINSA
    (herramientas/cargar_cie10.py, 12963 códigos a nivel de subcategoría cargados desde
    docs/fuentes/CIE10_MINSA_OFICIAL.xlsx). El validador de campo todavía no comprueba este
    valor contra ese catálogo (criterio C1, no implementado).'
- tabla: T2
  campo: 19
  nombre: Segundo Diagnóstico (CIE10)
  origen: columna
  expresion: cuenta.diagnosticos_secundarios_cie10[0] (en blanco si no hay)
  transformacion: ninguna(5)
  nota: 'Atención importada del sistema hospitalario (2026-11-19): primer diagnóstico secundario, validado
    contra el catálogo CIE-10 vigente al importar. Criterio C4: en blanco si no hay (cuenta manual).'
- tabla: T2
  campo: 20
  nombre: Tercer diagnóstico (CIE10)
  origen: columna
  expresion: cuenta.diagnosticos_secundarios_cie10[1] (en blanco si no hay)
  transformacion: ninguna(5)
  nota: 'Atención importada del sistema hospitalario (2026-11-19): segundo diagnóstico secundario. Criterio
    C4: en blanco si no hay. Si la atención trae más de dos secundarios, se guardan todos pero el estándar
    solo tiene dos posiciones.'
- tabla: T2
  campo: 21
  nombre: Fecha de Prestación
  origen: columna
  expresion: cuenta.fecha_prestacion
  transformacion: fecha(AAAAMMDD)
  nota: ''
- tabla: T2
  campo: 22
  nombre: Hora de Inicio de la Prestación
  origen: columna
  expresion: cuenta.hora_prestacion
  transformacion: hora(HHMMSS)
  nota: Atributo no enumerado explícitamente en la Sección 6.1; se agrega a cuenta_medica en la Fase 7.
- tabla: T2
  campo: 23
  nombre: Tipo del Profesional Responsable de la Prestación
  origen: calculado
  expresion: '''01'' si cuenta.colegiatura_medico; ''00'' si no'
  transformacion: ninguna(2)
  nota: 'Atención importada del sistema hospitalario (2026-11-19): el sistema hospitalario siempre envía
    un médico con su colegiatura: ''01 = Colegio Médico del Perú'' del dominio del campo. La cuenta manual
    no registra profesional y sigue con ''00: Profesional sin colegiatura''.'
- tabla: T2
  campo: 24
  nombre: Número de Colegiatura del Profesional Responsable de la Prestación
  origen: columna
  expresion: cuenta.colegiatura_medico (en blanco si el campo 23 es '00')
  transformacion: rellenar_ceros_izquierda(6)
  nota: 'Atención importada del sistema hospitalario (2026-11-19): criterios C1 y C2 del propio campo
    (no en blanco con tipo distinto de ''00''; en blanco con ''00'').'
- tabla: T2
  campo: 25
  nombre: Tipo de documento de identidad del Profesional Responsable de la Prestación
  origen: blanco
  expresion: ''
  transformacion: ''
  nota: El sistema hospitalario no envía el documento del médico, solo su colegiatura y nombre. Con el
    campo 23 en '00' el criterio C2 pide blanco; con '01' el dato queda pendiente porque la fuente no
    lo da.
- tabla: T2
  campo: 26
  nombre: Número del documento de identidad del profesional responsable
  origen: blanco
  expresion: ''
  transformacion: ''
  nota: 'Mismo caso que el campo 25: la fuente no envía el documento del médico.'
- tabla: T2
  campo: 27
  nombre: RUC de Entidad de Referencia
  origen: calculado
  expresion: cuenta.derivacion.ipress_ruc si existe, si no configuracion_ipress.ruc
  transformacion: ninguna(11)
  nota: 'Criterio C1: por defecto, el RUC propio; solo cambia cuando la cuenta corresponde al escenario
    ''paciente derivado'' (Sección 3.3, asegurados.json).'
- tabla: T2
  campo: 28
  nombre: Fecha de la Transferencia
  origen: columna
  expresion: cuenta.derivacion.fecha (nulo si no hay derivación)
  transformacion: fecha_o_blanco(AAAAMMDD)
  nota: 'Criterios C1/C2: en blanco cuando el RUC de referencia es el propio.'
- tabla: T2
  campo: 29
  nombre: Hora de transferencia
  origen: columna
  expresion: cuenta.derivacion.hora (nulo si no hay derivación)
  transformacion: hora_o_blanco(HHMMSS)
  nota: Mismos criterios que el campo 28.
- tabla: T2
  campo: 30
  nombre: Tipo de Hospitalización
  origen: blanco
  expresion: ''
  transformacion: ''
  nota: 'Criterio C3: en blanco cuando el tipo de cobertura no es 5. En una hospitalización importada
    el criterio C2 pide ''C'' o ''Q'', pero el sistema hospitalario no dice si hubo procedimiento quirúrgico:
    queda en blanco, pendiente de esa fuente.'
- tabla: T2
  campo: 31
  nombre: Fecha Ingreso Hospitalario
  origen: columna
  expresion: cuenta.fecha_ingreso_hospitalario si el campo 16 es '5'; en blanco si no
  transformacion: fecha_o_blanco(AAAAMMDD)
  nota: 'Atención importada del sistema hospitalario (2026-11-19). Criterio C1 (no anterior a la prestación)
    validado al importar; criterio C2: en blanco si no es hospitalaria.'
- tabla: T2
  campo: 32
  nombre: Fecha de Egreso Hospitalario
  origen: columna
  expresion: cuenta.fecha_alta_hospitalaria si el campo 16 es '5'; en blanco si no
  transformacion: fecha_o_blanco(AAAAMMDD)
  nota: 'Atención importada del sistema hospitalario (2026-11-19). Criterio C1 (no anterior al ingreso)
    validado al importar; criterio C2: en blanco si no es hospitalaria.'
- tabla: T2
  campo: 33
  nombre: Tipo de Egreso Hospitalario
  origen: blanco
  expresion: ''
  transformacion: ''
  nota: 'Criterio C2: en blanco si no es hospitalaria. En una hospitalización importada el sistema hospitalario
