  - numero: 22
    nombre: Base imponible
    obligatorio: true
    longitud: 12
    decimales: 2
    posicion_inicial: 164
    descripcion: 'Es el monto sobre el cual se aplica el porcentaje de IGV.

      Su registro no incluye el IGV.

      En formato: 999999999.99'
    criterios_texto: 'C1. Debe consignar un valor numérico con 2 decimales.

      C2. De no corresponder se consignará ''0.00''.

      C3. El campo debe estar alineado a la derecha.

      C4. En el caso el campo resultase negativo, podrá consignar ''0.00''.

      C5: En caso el mecanismo de pago sea 01-Pago por Servicios:

      Base Imponible = Tabla T2 ∑ (Total de Gastos Cubiertos sin IGV) - Monto Exonerado de IGV – (Total
      Copago Fijo afecto a IGV sin IGV + Total Copago Variable Afecto a IGV sin IGV).

      En el caso de Mecanismo de Pago diferente del 01-Pago por Servicios:

      Base Imponible = Monto Prepactado – (Total Copago Fijo afecto a IGV sin IGV + Total Copago Variable
      Afecto a IGV sin IGV)

      C6: Cuando el tipo de documento de pago es diferente al autorizado por la SUNAT (Campo 7 = 10 ó
      11)  se debe consignar el valor ''0.00'''
  - numero: 23
    nombre: IGV del Monto Facturado
    obligatorio: true
    longitud: 12
    decimales: 2
    posicion_inicial: 176
    descripcion: 'Impuesto General a las Ventas de la Base Imponible afecto a IGV.

      En formato: ''999999999.99'''
    criterios_texto: "C1. Debe consignar un valor numérico con 2 decimales. \nC2. De ser una IPRESS que\
      \ esta exento de IGV se consignará '0.00'. \nC3. De no corresponder se consignará '0.00'.\nC4. El\
      \ campo debe estar alineado a la derecha."
  - numero: 24
    nombre: Monto Total Facturado
    obligatorio: true
    longitud: 12
    decimales: 2
    posicion_inicial: 188
    descripcion: 'Corresponde al monto consignado en el documento facturador.

      Formato: ''999999999.99'''
    criterios_texto: 'C1. Debe consignar un valor numérico con 2 decimales.

      C2. De no corresponder se consignará ''0.00''.

      C3. El campo debe estar alineado a la derecha.

      C4. En el caso el campo resultase negativo, podrá consignar ''0.00''.

      C5: En caso el mecanismo de pago sea 01-Pago por Servicios:

      Monto Total Facturado = (Base Imponible + IGV del Monto Facturado + Monto Exonerado de IGV) – (Total
      Copago Fijo exonerado de IGV + Total Copago Variable Exonerado de IGV).

      En caso el mecanismo de pago sea distinto de 01-Pago por Servicios:

      Monto Total Facturado = (Base Imponible + IGV del Monto Facturado) – (Total Copago Fijo exonerado
      de IGV + Total Copago Variable Exonerado de IGV).

      C6: Cuando el tipo de documento de pago es diferente al autorizado por la SUNAT (Campo 7 = 10 ó
      11)  se debe consignar el valor ''0.00'''
