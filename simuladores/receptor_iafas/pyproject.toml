[project]
name = "simulador-receptor-iafas"
version = "0.1.0"
description = "Simulador local del receptor de la IAFAS (Fase 8, Seccion 9.2): servidor FTP y portal web de respuestas. NO es el validador oficial de SUSALUD."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "pyftpdlib>=1.5",
    "python-multipart>=0.0.12",
    "pyzipper>=0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = [
    "N999", # nombres de modulo en espanol
]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# pyftpdlib y pyzipper no publican anotaciones de tipos ni un paquete types-* en PyPI.
module = ["pyftpdlib.*", "pyzipper.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["pruebas"]
python_files = ["prueba_*.py"]
python_functions = ["prueba_*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
