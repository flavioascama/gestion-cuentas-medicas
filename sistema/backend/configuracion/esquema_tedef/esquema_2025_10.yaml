    posicion_inicial: 48
    descripcion: "Número del Documento de Pago emitido para facturar  \nEn formato: XXXX99999999 (serienúmero)."
    criterios_texto: 'C1: En caso el documento de pago sea electrónico, los primeros cuatro caracteres
      correspondientes a la serie  podrán ser alfanuméricos (Ejem: F00200025654).

      C2: En caso el documento de pago NO sea electrónico y la serie corresponda a tres caracteres, se
      deberá completar el cuarto carácter con el cero (Ejem: 000100021452).

      C3: El número contiene caracteres entre [0 al 9].

      C4: En caso que el Tipo de Documento de Pago es igual a 11, el código debe ser único y asignado
